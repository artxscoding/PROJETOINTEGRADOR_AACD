<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Voluntário - AACD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="voluntarios.css">
</head>
<body>
  <main class="tela">
    <!-- Formas de fundo (nuvem escura) -->
    <div class="forma forma-direita"></div>
    <div class="forma forma-esquerda"></div>

    <!-- Card de login -->
    <form class="card-login" action="#" method="post">
      <label for="email">Login</label>
      <input type="email" id="email" name="email" placeholder="xxxxxx@gmail.com">
      <a href="cadastro.html" class="link-branco">Não tem conta? Cadastre-se</a>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="Digite sua senha:">
      <a href="#" class="link-branco esqueci">Esqueci minha senha</a>

      <button type="submit" class="btn-entrar">Entrar</button>

      <a href="index.html" class="voltar">Voltar para tela inicial</a>
    </form>

    <!-- Logo no canto inferior direito -->
    <div class="logo">
      <span class="logo-texto"></span>
      <!-- Exporte o logo do Figma e salve como logo-aacd.png na mesma pasta -->
      <img src="logo-aacd2.png" alt="AACD" class="logo-img">
    </div>
  </main>
</body>
</html>
